name: CI

# Tests run locally before each push; this runs them on macOS and Windows
# when started by hand (Actions tab), and once a week as a safety net.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "22.1.8"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          curl.exe -sSfL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name.tar.xz"
          New-Item -ItemType Directory -Force C:\llvm | Out-Null
          tar -xf llvm.tar.xz -C C:\llvm
          Remove-Item llvm.tar.xz

      - name: Point llvm-sys at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = "C:\llvm\clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          "LLVM_SYS_221_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          # An explicit target makes .cargo/config.toml's static C runtime
          # setting apply to Tessel only, not to build scripts.
          "CARGO_BUILD_TARGET=x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TESSEL_BIN=target/x86_64-pc-windows-msvc/debug" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$prefix\bin\llvm-config.exe" --version
          # The release build lists libxml2 (xml2s.lib) as a dependency but doesn't ship it.
          # Only LLVM's Windows-manifest code uses it, which Tessel never calls, so an
          # empty stand-in library satisfies the linker.
          if (-not (Test-Path "$prefix\lib\xml2s.lib")) {
            Set-Content -Path stub.c -Value "void tessel_xml2_stub(void) {}"
            & "$prefix\bin\clang-cl.exe" /c stub.c /Fo:stub.obj
            & "$prefix\bin\llvm-lib.exe" /out:"$prefix\lib\xml2s.lib" stub.obj
          }

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Show the runtime's native link libraries
        run: cargo rustc -p tessel-runtime --lib --crate-type staticlib -- --print native-static-libs

      - name: Test
        run: cargo test --workspace

      - name: Build the examples
        shell: bash
        run: |
          mkdir -p apps
          BIN="${TESSEL_BIN:-target/debug}"
          "./$BIN/tessel" build examples/counter -o "apps/counter$EXE"
          "./$BIN/tessel" build examples/todos -o "apps/todos$EXE"
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Upload the examples
        uses: actions/upload-artifact@v4
        with:
          name: example-apps-${{ runner.os }}
          path: apps/
