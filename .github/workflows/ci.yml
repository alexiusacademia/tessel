name: CI

# Tests run locally before each push; this runs them on macOS, Windows and
# Linux (x86-64 and ARM64) when started by hand (Actions tab), and once a
# week as a safety net.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Run only these tests of crates/tessel-cli/tests/run.rs (names or parts of them, separated by spaces), with their output shown"
        type: string
        default: ""
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "22.1.8"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          curl.exe -sSfL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name.tar.xz"
          New-Item -ItemType Directory -Force C:\llvm | Out-Null
          tar -xf llvm.tar.xz -C C:\llvm
          Remove-Item llvm.tar.xz

      - name: Point llvm-sys at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = "C:\llvm\clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          "LLVM_SYS_221_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          # An explicit target makes .cargo/config.toml's static C runtime
          # setting apply to Tessel only, not to build scripts.
          "CARGO_BUILD_TARGET=x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TESSEL_BIN=target/x86_64-pc-windows-msvc/debug" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$prefix\bin\llvm-config.exe" --version
          # The release build lists libxml2 (xml2s.lib) as a dependency but doesn't ship it.
          # Only LLVM's Windows-manifest code uses it, which Tessel never calls, so an
          # empty stand-in library satisfies the linker.
          if (-not (Test-Path "$prefix\lib\xml2s.lib")) {
            Set-Content -Path stub.c -Value "void tessel_xml2_stub(void) {}"
            & "$prefix\bin\clang-cl.exe" /c stub.c /Fo:stub.obj
            & "$prefix\bin\llvm-lib.exe" /out:"$prefix\lib\xml2s.lib" stub.obj
          }

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Show the runtime's native link libraries
        run: cargo rustc -p tessel-runtime --lib --crate-type staticlib -- --print native-static-libs

      # The debugger's and Android's tests run on their own, each with a
      # limit: a test that never ends would otherwise hide what the others said.
      # Only some tests, with all they print (started by hand with `tests`).
      - name: Test some
        if: ${{ inputs.tests != '' }}
        timeout-minutes: 40
        run: cargo test -p tessel-cli --test run -- --nocapture ${{ inputs.tests }}

      - name: Test
        if: ${{ inputs.tests == '' }}
        timeout-minutes: 60
        run: cargo test --workspace -- --skip debugger_sessions --skip debug_adapter --skip android_packages

      - name: Test the debugger
        if: ${{ !cancelled() && inputs.tests == '' }}
        timeout-minutes: 15
        run: cargo test -p tessel-cli --test run debug -- --nocapture

      # (With its output read by another program, as the test below reads it.)
      - name: Check android doctor
        if: ${{ !cancelled() && inputs.tests == '' }}
        timeout-minutes: 5
        shell: bash
        run: cargo run -q -p tessel-cli -- android doctor | cat || true

      - name: Test Android packages
        if: ${{ !cancelled() && inputs.tests == '' }}
        timeout-minutes: 15
        run: cargo test -p tessel-cli --test run android_packages -- --nocapture

      - name: Build the examples
        if: ${{ inputs.tests == '' }}
        shell: bash
        run: |
          mkdir -p apps
          BIN="${TESSEL_BIN:-target/debug}"
          "./$BIN/tessel" build examples/counter -o "apps/counter$EXE"
          "./$BIN/tessel" build examples/todos -o "apps/todos$EXE"
          # A PDF made with this system's writer (see examples/invoice).
          "./$BIN/tessel" run examples/invoice && mv invoice.pdf apps/invoice.pdf
          # The details tessel.toml gives a Windows .exe.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -Command "(Get-Item apps/todos.exe).VersionInfo | Format-List ProductName,FileDescription,FileVersion,ProductVersion,CompanyName,LegalCopyright,OriginalFilename"
          fi
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Upload the examples
        uses: actions/upload-artifact@v4
        # (A full artifact store shouldn't fail the tests.)
        continue-on-error: true
        with:
          name: example-apps-${{ runner.os }}
          path: apps/
          # (For trying a build by hand; the repository's storage is limited.)
          retention-days: 3

  # Linux, in AlmaLinux 9 (glibc 2.34, what `tessel` itself needs), with
  # what a desktop has: fonts (DejaVu and Liberation, which tests/run's
  # `.linux.out` files are for) and Mesa's software GPU, as apps draw only
  # through the GPU there. LLVM is its official Linux build.
  test-linux:
    name: Test (linux-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            llvm: X64
          - arch: arm64
            runner: ubuntu-24.04-arm
            llvm: ARM64
    runs-on: ${{ matrix.runner }}
    container: almalinux:9
    steps:
      - name: Install the system's parts
        run: |
          dnf -y -q install gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils git xz tar make perl-core \
            zlib-devel libzstd-devel libxml2-devel libffi-devel which findutils \
            fontconfig dejavu-sans-fonts dejavu-sans-mono-fonts dejavu-serif-fonts \
            liberation-mono-fonts liberation-sans-fonts liberation-serif-fonts \
            mesa-dri-drivers mesa-libEGL mesa-libgbm vulkan-loader
          echo "/opt/rh/gcc-toolset-13/root/usr/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: /opt/llvm
          key: llvm-${{ env.LLVM_VERSION }}-linux-${{ matrix.arch }}-polly

      - name: Install LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          name="LLVM-$LLVM_VERSION-Linux-${{ matrix.llvm }}"
          mkdir -p /opt
          curl -sSfL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz" | tar -xJ -C /opt \
            "$name/bin/llvm-config" "$name/include/llvm" "$name/include/llvm-c" "$name/include/lld" \
            --wildcards "$name/lib/libLLVM*.a" "$name/lib/libPolly*.a" "$name/lib/liblld*.a"
          mv "/opt/$name" /opt/llvm

      # LLVM's llvm-config: its shared library isn't there (only static
      # ones are), and it names the build machine's libzstd.a by its path.
      - name: Point llvm-sys at LLVM
        run: |
          mkdir -p /opt/llvm-prefix/bin
          ln -sfn /opt/llvm/lib /opt/llvm-prefix/lib
          ln -sfn /opt/llvm/include /opt/llvm-prefix/include
          cat > /opt/llvm-prefix/bin/llvm-config <<'EOF'
          #!/bin/sh
          case " $* " in *" --link-shared "*) exit 1;; esac
          /opt/llvm/bin/llvm-config "$@" | sed 's#[^ ]*/libzstd\.a#-lzstd#g'
          EOF
          chmod +x /opt/llvm-prefix/bin/llvm-config
          echo "LLVM_SYS_221_PREFIX=/opt/llvm-prefix" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test some
        if: ${{ inputs.tests != '' }}
        timeout-minutes: 40
        run: cargo test -p tessel-cli --test run -- --nocapture ${{ inputs.tests }}

      - name: Test
        if: ${{ inputs.tests == '' }}
        timeout-minutes: 60
        run: cargo test --workspace -- --skip debugger_sessions --skip debug_adapter --skip android_packages

      # (On their own, as on macOS and Windows: they wait on each other's
      # timing, which a busy runner upsets.)
      - name: Test the debugger
        if: ${{ !cancelled() && inputs.tests == '' }}
        timeout-minutes: 15
        run: cargo test -p tessel-cli --test run debug -- --nocapture

      - name: Build the examples
        if: ${{ inputs.tests == '' }}
        run: |
          mkdir -p apps
          ./target/debug/tessel build examples/counter -o apps/counter
          ./target/debug/tessel build examples/todos -o apps/todos
