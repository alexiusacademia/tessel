# Builds standalone Tessel packages and publishes them as a GitHub release
# when a version tag like v0.1.0 is pushed.
#
# Each release has the packages, SHA256SUMS, latest-<platform>.txt (which
# `tessel update` and the install scripts read from the latest release) and
# the install scripts. (Releases up to 0.16.3 were also copied to the bucket
# gs://tessel-releases, which the `tessel update` of 0.15.1 and older reads.
# Its latest is 0.16.3, whose `tessel update` reads GitHub.)
#
# The packages contain `tessel` with LLVM and its linker built in, the runtime
# library and sdk/. They need nothing else installed.
#
# Everything runs on GitHub's runners (free for a public repository), and the
# packages go from the package jobs to the publish job as artifacts. A tag
# builds both platforms, and publishes only if both succeed, so the two
# platforms are always at the same version. A manual run builds macOS,
# and Windows too if `windows` is ticked. Each platform has its own
# latest-<platform>.txt.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (otherwise only build and test); the version's tag must exist"
        type: boolean
        default: false
      windows:
        description: "Also build the Windows package (a tag always does)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "22.1.8"
  LLVM_MINGW_VERSION: "20260922"

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || inputs.windows) && '[{"name":"macos-arm64","runner":"macos-15","target":"aarch64-apple-darwin"},{"name":"windows-x64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]' || '[{"name":"macos-arm64","runner":"macos-15","target":"aarch64-apple-darwin"}]') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # On Windows, apps use the MinGW-w64 runtime (x86_64-pc-windows-gnullvm)
          # so the package can include everything linking them needs. On
          # macOS, the runtime is built for Android too.
          targets: ${{ matrix.target }}${{ runner.os == 'Windows' && ',x86_64-pc-windows-gnullvm' || ',aarch64-linux-android' }}

      # ---- macOS: LLVM's official static build, linked with its own lld ----

      # LLVM (the parts the build needs) and zstd stay in the cache between runs.
      - name: Cache LLVM (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/llvm/${{ env.LLVM_VERSION }}
            ${{ runner.tool_cache }}/tessel-staticlibs
          key: llvm-${{ env.LLVM_VERSION }}-macos-arm64-zstd-1.5.7

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          if [[ -x "$RUNNER_TOOL_CACHE/llvm/$LLVM_VERSION/bin/llvm-config" ]]; then
            echo "LLVM $LLVM_VERSION already installed"
            exit 0
          fi
          name="LLVM-$LLVM_VERSION-macOS-ARM64"
          curl -sSfL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz"
          mkdir -p "$RUNNER_TOOL_CACHE/llvm"
          # Only what building Tessel needs (the full release is 7 GB).
          tar -xf llvm.tar.xz -C "$RUNNER_TOOL_CACHE/llvm" \
            "$name/bin/llvm-config" "$name/bin/clang" "$name/bin/clang-*" "$name/bin/lld" "$name/bin/ld64.lld" \
            "$name/lib/clang" "$name/include/llvm" "$name/include/llvm-c" "$name/include/lld" \
            "$name/lib/libLLVM*.a" "$name/lib/libPolly*.a" "$name/lib/liblld*.a"
          rm llvm.tar.xz
          rm -rf "$RUNNER_TOOL_CACHE/llvm/$LLVM_VERSION"
          mv "$RUNNER_TOOL_CACHE/llvm/$name" "$RUNNER_TOOL_CACHE/llvm/$LLVM_VERSION"

      - name: Configure the build (macOS)
        if: runner.os == 'macOS'
        run: |
          # LLVM needs zstd. Build it for macOS 11 (Homebrew's is for the
          # runner's macOS) and link it statically: a folder with only the
          # static library comes first, and so does the SDK's libc++ (not
          # LLVM's), so `tessel` depends on nothing outside macOS.
          libs="$RUNNER_TOOL_CACHE/tessel-staticlibs"
          if [[ ! -f "$libs/libzstd.a" ]]; then
            curl -sSfL https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz | tar -xz
            MACOSX_DEPLOYMENT_TARGET=11.0 make -C zstd-1.5.7/lib libzstd.a -j4 > /dev/null
            mkdir -p "$libs"
            cp zstd-1.5.7/lib/libzstd.a "$libs/"
          fi
          llvm="$RUNNER_TOOL_CACHE/llvm/$LLVM_VERSION"
          sdk="$(xcrun --show-sdk-path)"
          {
            echo "LLVM_SYS_221_PREFIX=$llvm"
            # LLVM's libraries are LLVM 22 bitcode, which only its own lld can link.
            echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$llvm/bin/clang"
            echo "RUSTFLAGS=-L native=$libs -L native=$sdk/usr/lib -C link-arg=-fuse-ld=lld -C link-arg=-isysroot -C link-arg=$sdk"
          } >> "$GITHUB_ENV"

      # ---- Windows: LLVM's official build is already static ----

      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: llvm-cache-win
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && steps.llvm-cache-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          curl.exe -sSfL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name.tar.xz"
          New-Item -ItemType Directory -Force C:\llvm | Out-Null
          tar -xf llvm.tar.xz -C C:\llvm
          Remove-Item llvm.tar.xz

      - name: Cache llvm-mingw (Windows)
        if: runner.os == 'Windows'
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-x86_64

      - name: Install llvm-mingw (Windows)
        if: runner.os == 'Windows' && steps.mingw-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
          curl.exe -sSfL -o mingw.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip"
          Expand-Archive mingw.zip -DestinationPath C:\
          Rename-Item "C:\$name" C:\llvm-mingw
          Remove-Item mingw.zip

      - name: Configure the build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = "C:\llvm\clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          "LLVM_SYS_221_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          # The MinGW runtime library is built with llvm-mingw's clang (for ring's C code).
          "CC_x86_64_pc_windows_gnullvm=C:\llvm-mingw\bin\x86_64-w64-mingw32-clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AR_x86_64_pc_windows_gnullvm=C:\llvm-mingw\bin\llvm-ar.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=C:\llvm-mingw\bin\x86_64-w64-mingw32-clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          # LLVM lists libxml2 (xml2s.lib) but doesn't ship it; lld's manifest
          # merger uses it. Tessel never merges manifests, so stubs will do.
          & "$prefix\bin\clang-cl.exe" /c /MT install\xml2-stub.c /Fo:xml2-stub.obj
          & "$prefix\bin\llvm-lib.exe" /out:"$prefix\lib\xml2s.lib" xml2-stub.obj

      # ---- Build, check and package ----

      - name: Build
        shell: bash
        run: |
          # LLVM's linker is built into tessel (see crates/tessel-cli/build.rs).
          cargo build --release --workspace --target ${{ matrix.target }} --features tessel-cli/bundled-linker
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # The runtime library Windows apps are linked with, for MinGW-w64.
            cargo build --release -p tessel-runtime --target x86_64-pc-windows-gnullvm
          fi

      # The runtime Android apps are linked with. It isn't in the package:
      # `tessel build --android` downloads it the first time (it's the same
      # for every computer apps are built on). Needs the Android NDK, which
      # GitHub's macOS runners have.
      - name: Build the runtime for Android (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          ndk="$(ls -d "$sdk"/ndk/* | sort -V | tail -1)/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          # (Not the Mac's linker settings: nothing is linked here.)
          RUSTFLAGS="" CC_aarch64_linux_android="$ndk/aarch64-linux-android30-clang" AR_aarch64_linux_android="$ndk/llvm-ar" \
            cargo build --release -p tessel-runtime --target aarch64-linux-android
          mkdir -p dist/android
          cp target/aarch64-linux-android/release/libtessel_runtime.a dist/android/
          "$ndk/llvm-strip" --strip-debug dist/android/libtessel_runtime.a
          tar -czf "dist/tessel-$VERSION-android-arm64.tar.gz" -C dist/android libtessel_runtime.a

      - name: Package
        shell: bash
        run: |
          out="target/${{ matrix.target }}/release"
          mkdir -p dist/pkg
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$out/tessel.exe" dist/pkg/
            cp target/x86_64-pc-windows-gnullvm/release/libtessel_runtime.a dist/pkg/
            # MinGW-w64's C runtime and the Windows import libraries, for the built-in linker.
            sh install/windows-sdk.sh /c/llvm-mingw dist/pkg/sdk
          else
            cp "$out/tessel" "$out/libtessel_runtime.a" dist/pkg/
            strip -x dist/pkg/tessel
            # Stubs of the system libraries apps link with, for the built-in linker.
            python3 install/macos-stubs.py "$out/libtessel_runtime.a" dist/pkg/sdk
          fi
          cp install/PACKAGE-README.txt dist/pkg/README.txt

      # Signs tessel with the Developer ID certificate and has Apple notarize
      # it, so macOS runs it even when it's downloaded with a browser. Needs
      # the secrets MACOS_CERT_P12 (base64 .p12) and MACOS_CERT_PASSWORD, and
      # for notarizing either NOTARY_APPLE_ID + NOTARY_PASSWORD (an
      # app-specific password) or an App Store Connect API key: NOTARY_KEY_P8
      # (base64), NOTARY_KEY_ID and, for a team key, NOTARY_ISSUER_ID.
      # Releases (tags) require them.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: MGUT6927DK
        run: |
          if [[ -z "$MACOS_CERT_P12" || ( -z "$NOTARY_APPLE_ID" && -z "$NOTARY_KEY_P8" ) ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::signing secrets are missing; a release must be signed"
              exit 1
            fi
            echo "::warning::signing secrets are missing; the package is not signed"
            exit 0
          fi
          # A temporary keychain with just the signing certificate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # Remember the keychain search list, to restore it afterwards.
          security list-keychains -d user | tr -d '"' | xargs > "$RUNNER_TEMP/keychains.txt"
          security list-keychains -d user -s "$keychain" $(cat "$RUNNER_TEMP/keychains.txt")
          rm "$RUNNER_TEMP/cert.p12"

          # (The entitlement lets `tessel repl` and hot reload run the code they compile.)
          codesign --force --timestamp --options runtime --entitlements install/entitlements.plist \
            --sign "Developer ID Application" dist/pkg/tessel
          codesign --verify --strict --verbose=2 dist/pkg/tessel

          # Notarize (a bare executable can't be stapled; macOS checks online).
          # Pasted values may carry stray whitespace.
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          if [[ -n "$NOTARY_APPLE_ID" ]]; then
            auth=(--apple-id "$(trim "$NOTARY_APPLE_ID")" --password "$(trim "$NOTARY_PASSWORD")" --team-id "$NOTARY_TEAM_ID")
          else
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
            auth=(--key "$RUNNER_TEMP/key.p8" --key-id "$(trim "$NOTARY_KEY_ID")")
            # A team API key has an issuer ID; an individual key doesn't.
            [[ -n "$NOTARY_ISSUER_ID" ]] && auth+=(--issuer "$(trim "$NOTARY_ISSUER_ID")")
          fi
          ditto -c -k --keepParent dist/pkg/tessel "$RUNNER_TEMP/tessel.zip"
          xcrun notarytool submit "$RUNNER_TEMP/tessel.zip" --wait --timeout 30m "${auth[@]}" \
            | tee "$RUNNER_TEMP/notary.txt"
          rm -f "$RUNNER_TEMP/key.p8"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary.txt"

      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [[ -f "$RUNNER_TEMP/keychains.txt" ]]; then
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.txt")
          fi
          [[ -f "$keychain" ]] && security delete-keychain "$keychain" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/key.p8"

      - name: Check the package is standalone (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L dist/pkg/tessel
          if otool -L dist/pkg/tessel | tail -n +2 | grep -vE '^[[:space:]]*(/usr/lib/|/System/)'; then
            echo "::error::tessel depends on libraries outside macOS"
            exit 1
          fi

      - name: Smoke test the package
        shell: bash
        run: |
          # Run from the package only, without the build's LLVM on PATH. On
          # macOS, without /usr/bin either, to prove no system linker is used.
          t="dist/pkg/tessel${{ runner.os == 'Windows' && '.exe' || '' }}"
          run() { if [[ "$RUNNER_OS" == "macOS" ]]; then env -i HOME="$HOME" PATH=/bin "$@"; else "$@"; fi; }
          run "$t" --version
          run "$t" check examples/todos
          run "$t" run tests/run/hello.tsl
          # Math the C library does, including calls LLVM rewrites (pow(10, x) is __exp10 on macOS).
          [[ "$(run "$t" run tests/run/math_calls.tsl | tr -d '\r')" == "$(tr -d '\r' < tests/run/math_calls.out)" ]]
          # Data changed in place, with the optimized runtime (issue #1: it
          # broke only there, so the tests, which use a debug build, missed it).
          [[ "$(run "$t" run tests/run/data_append.tsl | tr -d '\r')" == "$(tr -d '\r' < tests/run/data_append.out)" ]]
          # The REPL runs code inside `tessel` (the signed one, on macOS).
          [[ "$(echo '20 + 22' | run "$t" repl | tr -d '\r')" == "42" ]]
          run "$t" build examples/todos -o dist/smoke/todos
          # How big the smallest app is (only the runtime it uses is linked in).
          mkdir -p dist/smoke/hello
          printf 'app Hello {\n    Text("hello")\n}\n' > dist/smoke/hello/main.tsl
          run "$t" build dist/smoke/hello -o dist/smoke/hello-app
          echo "A one-Text app is $(wc -c < dist/smoke/hello-app${{ runner.os == 'Windows' && '.exe' || '' }}) bytes"
          TESSEL_SCRIPT='click field 1; type "hello"; click "Add"; tree' dist/smoke/todos${{ runner.os == 'Windows' && '.exe' || '' }}
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # The installer of a Windows app (--bundle): it installs the app,
            # which runs, and its uninstaller removes it.
            mkdir -p dist/smoke/notes
            # .note is its own type, with an icon; .memo it only opens.
            printf 'app Notes(documentTypes: ["memo"]) {\n    Text("notes")\n}\n' > dist/smoke/notes/main.tsl
            printf '[app]\nname = "Smoke Notes"\nid = "dev.tessel.smokenotes"\nversion = "1.2.3"\n\n[[app.documents]]\nname = "Note"\nextensions = ["note"]\nowned = true\nicon = "note.png"\n' > dist/smoke/notes/tessel.toml
            cp crates/tessel-cli/assets/icon.png dist/smoke/notes/note.png
            run "$t" build dist/smoke/notes --bundle -o dist/smoke/notes-setup/notes.exe
            pwsh -File install/check-setup.ps1 -Setup "dist/smoke/notes-setup/Smoke Notes Setup.exe" -Name "Smoke Notes" -Id dev.tessel.smokenotes -Extension note -Icon 2 -Offered memo
          fi

      - name: Archive
        shell: bash
        run: |
          cd dist/pkg
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "../tessel-$VERSION-${{ matrix.name }}.zip" . > /dev/null
            # What `tessel build --windows` builds Windows apps with on a Mac:
            # the runtime and the Windows libraries, downloaded the first time.
            tar -czf "../tessel-$VERSION-${{ matrix.name }}-parts.tar.gz" libtessel_runtime.a sdk
          else
            tar -czf "../tessel-$VERSION-${{ matrix.name }}.tar.gz" .
          fi
          ls -la ..

      # For the publish job (and for looking at a build by hand).
      - uses: actions/upload-artifact@v4
        with:
          name: tessel-${{ matrix.name }}
          path: dist/tessel-*
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish
    needs: package
    if: github.ref_type == 'tag' || inputs.publish
    # On a Mac, to check that the Mac's tessel builds Windows apps.
    runs-on: macos-15
    permissions:
      contents: write # to make the GitHub release
    steps:
      - uses: actions/checkout@v4

      # The package jobs' packages, all in dist/.
      - uses: actions/download-artifact@v4
        with:
          pattern: tessel-*
          path: dist
          merge-multiple: true

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          ls -la dist
          # The Mac's tessel builds a Windows app with the Windows parts
          # (`tessel build --windows`), before anything is published.
          if ls dist/tessel-*-macos-arm64.tar.gz dist/tessel-*-windows-x64-parts.tar.gz > /dev/null 2>&1; then
            mkdir -p dist/check/mac dist/check/windows
            tar -xzf dist/tessel-*-macos-arm64.tar.gz -C dist/check/mac
            tar -xzf dist/tessel-*-windows-x64-parts.tar.gz -C dist/check/windows
            TESSEL_WINDOWS_PARTS="$PWD/dist/check/windows" dist/check/mac/tessel build examples/todos --windows -o dist/check/todos.exe
            file dist/check/todos.exe | grep -q "PE32+ executable (GUI) x86-64" || { echo "::error::tessel build --windows didn't make a Windows app"; exit 1; }
            # And its installer (--bundle).
            TESSEL_WINDOWS_PARTS="$PWD/dist/check/windows" dist/check/mac/tessel build examples/todos --windows --bundle -o dist/check/setup/todos.exe
            file "dist/check/setup/Todos Setup.exe" | grep -q "PE32+ executable (GUI) x86-64" || { echo "::error::tessel build --windows --bundle didn't make an installer"; exit 1; }
            rm -rf dist/check
          fi
          (cd dist && shasum -a 256 tessel-* > SHA256SUMS)
          # The newest version for each platform built this time.
          pointers=()
          for platform in macos windows; do
            if ls dist/tessel-*-"$platform"-* > /dev/null 2>&1; then
              echo "$version" > "latest-$platform.txt"
              pointers+=("latest-$platform.txt")
            fi
          done
          # latest.txt: for older install scripts (which are macOS or Windows alike).
          [[ -f latest-macos.txt ]] && cp latest-macos.txt latest.txt && pointers+=(latest.txt)

          # The GitHub release: the packages, their checksums, the pointers
          # and the install scripts. It's marked the latest unless a newer
          # version is out already (a fix to an older one).
          newest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          latest=true
          if [[ -n "$newest" && "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -1)" != "$version" ]]; then
            latest=false
          fi
          # The notes: the release commit's message after its first line
          # (with or without a blank line after it).
          { git log -1 --format=%B | tail -n +2 | sed '/./,$!d'
            echo
            echo "What's new: https://tessel-lang.syncster.dev/about/whats-new/"
          } > "$RUNNER_TEMP/notes.md"
          # A draft first, then each file (again when an upload times out),
          # and only then the release, so that nobody gets it half there. A
          # run that's run again finds its draft.
          if ! gh release view "$version" > /dev/null 2>&1; then
            gh release create "$version" --draft --verify-tag --title "Tessel ${version#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          for file in dist/* "${pointers[@]}" install/install.sh install/install.ps1; do
            for try in 1 2 3 4 5; do
              gh release upload "$version" "$file" --clobber && break
              [[ $try == 5 ]] && { echo "::error::can't upload $file"; exit 1; }
              echo "Uploading $file again ($try)"
              sleep 15
            done
          done
          gh release edit "$version" --draft=false --latest="$latest"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$version"

      # The Homebrew formula (alexiusacademia/homebrew-tessel) gets the new
      # macOS package, unless it has a newer version already. TAP_DEPLOY_KEY
      # is the private half of a deploy key of that repository, with write
      # access.
      - name: Update the Homebrew formula
        if: github.ref_type == 'tag'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "$TAP_DEPLOY_KEY" ]]; then
            echo "::warning::TAP_DEPLOY_KEY isn't set; the Homebrew formula isn't updated"
            exit 0
          fi
          version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          file="tessel-$version-macos-arm64.tar.gz"
          sha="$(awk -v f="$file" '$2 == f { print $1 }' dist/SHA256SUMS)"
          [[ -n "$sha" ]] || { echo "::error::SHA256SUMS has no $file"; exit 1; }
          key="$RUNNER_TEMP/tap-key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          tap="$RUNNER_TEMP/homebrew-tessel"
          rm -rf "$tap"
          git clone -q git@github.com:alexiusacademia/homebrew-tessel.git "$tap"
          formula="$tap/Formula/tessel.rb"
          had="$(sed -n 's|.*/download/\(v[0-9.]*\)/.*|\1|p' "$formula" | head -1)"
          if [[ "$(printf '%s\n%s\n' "$had" "$version" | sort -V | tail -1)" != "$version" || "$had" == "$version" ]]; then
            echo "The formula has $had already."
          else
            sed -i '' -e "s|/download/v[0-9.]*/tessel-v[0-9.]*-macos-arm64.tar.gz|/download/$version/$file|" \
              -e "s|sha256 \"[0-9a-f]*\"|sha256 \"$sha\"|" "$formula"
            git -C "$tap" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "Tessel ${version#v}"
            git -C "$tap" push -q origin HEAD
            echo "The Homebrew formula is at $version."
          fi
          rm -f "$key"
