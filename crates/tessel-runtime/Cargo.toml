[package]
name = "tessel-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = "3.6.1"
parley = "0.11"
png = "0.18.1"
pollster = "1.0.1"
# JSON and MessagePack for toJson/fromJson/toBinary/fromBinary.
rmp-serde = "1.3.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Native Open and Save dialogs (openFile, saveFile).
rfd = { version = "0.17.2", default-features = false }
ureq = "3.4.2"
vello = "0.10"
vello_svg = "0.11"
winit = "0.30"

[lib]
crate-type = ["staticlib", "rlib"]

[lints]
workspace = true
