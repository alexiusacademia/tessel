[package]
name = "tessel-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The renderers: the GPU one (vello, wgpu and parley), and the system's
# (`native`). Where the system's is on, apps use it; elsewhere the GPU's.
default = ["gpu", "native"]
gpu = ["dep:vello", "dep:skrifa", "dep:wgpu", "dep:parley", "dep:image", "dep:pollster", "dep:fontique"]
# The system's renderer: on macOS Core Graphics, Core Text and ImageIO (see
# ui/mac); on Windows Direct2D, DirectWrite and WIC (see ui/win). They come
# with the system, so apps carry none of them.
native = ["dep:windows", "dep:windows-numerics", "dep:windows-core"]

[dependencies]
parley = { version = "0.11", optional = true }
pollster = { version = "1.0.1", optional = true }
# Glyphs' outlines, for text in PDFs (vello and parley draw with it too).
skrifa = { version = "0.44", optional = true }
# Dates in the computer's time zone (formatDate, parseDate, date).
# Reading Markdown, for the `Markdown` view.
pulldown-cmark = { version = "0.13", default-features = false }
# zlib, deflate and gzip for `data.compressed()` and `data.decompressed()`.
flate2 = "1"
# PNG and JPEG files for `Image`.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Named time zones ("Europe/Paris"): the tz database, built into programs
# that use dates. And the name of the computer's own zone.
chrono-tz = { version = "0.10", default-features = false }
iana-time-zone = "0.1"
# JSON and MessagePack for toJson/fromJson/toBinary/fromBinary.
rmp-serde = "1.3.1"
serde = "1.0.229"
# (float_roundtrip: a number read back is the very number that was written.)
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
ureq = "3.4.2"
# WebSockets (openWebSocket), over the same TLS as ureq.
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# Sockets (connectTCP, listenTCP, openUDP, serveHTTP): one thread waits on
# all of them at once (kqueue, epoll or IOCP), see ui/app/sockets.rs.
mio = { version = "1", features = ["net", "os-poll"] }
# Socket options std doesn't expose (reusing a port for multicast).
socket2 = { version = "0.6", features = ["all"] }
# The computer's own addresses (localAddresses).
if-addrs = "0.14"
# Without wgpu's default backends: each platform gets only its own (below).
vello = { version = "0.10", default-features = false, features = ["wgpu"], optional = true }
# Reading SVG (both renderers), and the geometry drawings are made of.
usvg = "0.48"
kurbo = "0.13"
winit = "0.30"
pdf-writer = "0.15.0"
subsetter = { version = "0.2.6", default-features = false }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
# `data.hash(…)`.
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
md-5 = { version = "0.10", default-features = false }

# The GPU backend each platform draws with, and no others: every backend
# brings its own code and shader translator into every app.
[target.'cfg(target_os = "macos")'.dependencies]
# The menu bar, and the files and Quit the system sends the app (see ui/native.rs).
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
wgpu = { version = "29", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }
[target.'cfg(windows)'.dependencies]
# The Windows renderer: Direct2D, DirectWrite and WIC (see ui/win).
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    # The tray icon's picture (see ui/tray.rs).
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # Sound and video (see ui/media.rs).
    "Win32_Media_MediaFoundation",
    # Dragging files out of the app (see ui/desktop.rs).
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    # The installer of Windows apps (see setup.rs).
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = { version = "0.3", optional = true }
# (For `#[implement]`: a DirectWrite text renderer that collects glyphs for PDFs.)
windows-core = { version = "0.62", optional = true }
wgpu = { version = "29", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"] }
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "29", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux finds fonts with fontconfig, which programs load as they start
# rather than link with, so a command-line program also runs where there's
# none (a server).
fontique = { version = "0.11", features = ["fontconfig-dlopen"], optional = true }
# Open and Save dialogs through the desktop's portal (GNOME, KDE…), over
# D-Bus, so apps need no GTK.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The clipboard on Wayland too (where the desktop offers it; X11's through
# XWayland otherwise).
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# Talking to the desktop over D-Bus: its Print portal (ui/print.rs), tray
# (ui/tray.rs) and notifications.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# The tray icon and its menu (StatusNotifierItem, as KDE, GNOME with its
# AppIndicator extension, XFCE and Cinnamon show them).
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
# Loading GStreamer (sound and video, ui/gstreamer.rs) as the first player
# opens, so programs don't depend on it.
libloading = "0.8"
# Dragging a file out of the app on X11 (ui/desktop.rs), over its own
# connection to the X server.
x11rb = "0.13"

# What Android has no counterpart of (or its own, see ui/android.rs).
# Screen readers (VoiceOver, Narrator) are told what's in the window.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
accesskit = "0.25"
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }

# On Linux, screen readers (Orca) listen over AT-SPI, which AccessKit speaks
# on a thread of its own.
[target.'cfg(target_os = "linux")'.dependencies.accesskit_winit]
version = "0.34"
default-features = false
features = ["rwh_06", "accesskit_unix", "async-io"]

[target.'cfg(not(target_os = "android"))'.dependencies]
# The clipboard, for text only (its picture support would bring image decoders).
arboard = { version = "3.6.1", default-features = false }
# Native Open and Save dialogs (openFile, saveFile).
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
# The activity the app runs in: `android_main` gets it (see ui/android.rs).
winit = { version = "0.30", features = ["android-native-activity"] }
# Asking the activity (which is Java's) for the screen's insets, and to step back.
jni-sys = "0.3"

[target.'cfg(unix)'.dependencies]
# The stack overflow handler (sigaltstack, sigaction, the stack's bounds).
libc = "0.2"

[lib]
crate-type = ["staticlib", "rlib"]

# Builds the macOS menu bar with AppKit, which needs the main thread (so no
# test harness). Only with TESSEL_NATIVE_TEST=1: it talks to the window server.
[[test]]
name = "native_menu"
harness = false

# Plays a video with the system's player (see ui::check_video), on the main
# thread. Only with TESSEL_NATIVE_TEST=1.
[[test]]
name = "media"
harness = false

# Shows a page in the system's web view (see ui::check_web_view). Only with
# TESSEL_NATIVE_TEST=1.
[[test]]
name = "web"
harness = false

# Prepares a view's layer as a window's is (see ui::check_layer). Only with
# TESSEL_NATIVE_TEST=1.
[[test]]
name = "layer"
harness = false

[lints]
workspace = true

[dev-dependencies]
ttf-parser = "0.25"
