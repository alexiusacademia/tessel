[package]
name = "tessel-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = "3.6.1"
parley = "0.11"
png = "0.18.1"
pollster = "1.0.1"
# Dates in the computer's time zone (formatDate, parseDate, date).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# JSON and MessagePack for toJson/fromJson/toBinary/fromBinary.
rmp-serde = "1.3.1"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Native Open and Save dialogs (openFile, saveFile).
rfd = { version = "0.17.2", default-features = false }
ureq = "3.4.2"
# WebSockets (openWebSocket), over the same TLS as ureq.
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
vello = "0.10"
vello_svg = "0.11"
winit = "0.30"

[target.'cfg(unix)'.dependencies]
# The stack overflow handler (sigaltstack, sigaction, the stack's bounds).
libc = "0.2"

[lib]
crate-type = ["staticlib", "rlib"]

[lints]
workspace = true
