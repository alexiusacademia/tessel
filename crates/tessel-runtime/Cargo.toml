[package]
name = "tessel-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The renderers: the GPU one (vello, wgpu and parley), and the system's
# (`native`). Where the system's is on, apps use it; elsewhere the GPU's.
default = ["gpu", "native"]
gpu = ["dep:vello", "dep:vello_svg", "dep:wgpu", "dep:parley", "dep:image", "dep:pollster"]
# The system's renderer: on macOS Core Graphics, Core Text and ImageIO (see
# ui/mac); on Windows Direct2D, DirectWrite and WIC (see ui/win). They come
# with the system, so apps carry none of them.
native = ["dep:windows", "dep:windows-numerics"]

[dependencies]
# The clipboard, for text only (its picture support would bring image decoders).
arboard = { version = "3.6.1", default-features = false }
parley = { version = "0.11", optional = true }
pollster = { version = "1.0.1", optional = true }
# Dates in the computer's time zone (formatDate, parseDate, date).
# Reading Markdown, for the `Markdown` view.
pulldown-cmark = { version = "0.13", default-features = false }
# zlib, deflate and gzip for `data.compressed()` and `data.decompressed()`.
flate2 = "1"
# PNG and JPEG files for `Image`.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Named time zones ("Europe/Paris"): the tz database, built into programs
# that use dates. And the name of the computer's own zone.
chrono-tz = { version = "0.10", default-features = false }
iana-time-zone = "0.1"
# JSON and MessagePack for toJson/fromJson/toBinary/fromBinary.
rmp-serde = "1.3.1"
serde = "1.0.229"
# (float_roundtrip: a number read back is the very number that was written.)
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# Native Open and Save dialogs (openFile, saveFile).
rfd = { version = "0.17.2", default-features = false }
ureq = "3.4.2"
# WebSockets (openWebSocket), over the same TLS as ureq.
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# Without wgpu's default backends: each platform gets only its own (below).
vello = { version = "0.10", default-features = false, features = ["wgpu"], optional = true }
vello_svg = { version = "0.11", optional = true }
# Reading SVG (both renderers), and the geometry drawings are made of.
usvg = "0.48"
kurbo = "0.13"
winit = "0.30"

# The GPU backend each platform draws with, and no others: every backend
# brings its own code and shader translator into every app.
[target.'cfg(target_os = "macos")'.dependencies]
# The menu bar, and the files and Quit the system sends the app (see ui/native.rs).
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
wgpu = { version = "29", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }
[target.'cfg(windows)'.dependencies]
# The Windows renderer: Direct2D, DirectWrite and WIC (see ui/win).
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-numerics = { version = "0.3", optional = true }
wgpu = { version = "29", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"] }
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "29", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles"] }

[target.'cfg(unix)'.dependencies]
# The stack overflow handler (sigaltstack, sigaction, the stack's bounds).
libc = "0.2"

[lib]
crate-type = ["staticlib", "rlib"]

# Builds the macOS menu bar with AppKit, which needs the main thread (so no
# test harness). Only with TESSEL_NATIVE_TEST=1: it talks to the window server.
[[test]]
name = "native_menu"
harness = false

[lints]
workspace = true
