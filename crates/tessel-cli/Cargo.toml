[package]
name = "tessel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tessel"
path = "src/main.rs"

[features]
# Build LLVM's linker (lld) into `tessel` (release packages), so building apps
# doesn't need Apple's Command Line Tools or Visual Studio's linker.
bundled-linker = []

[build-dependencies]
cc = "1.5.1"

[dependencies]
cc = "1.5.1"
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1.0.151"
tessel-compiler = { path = "../tessel-compiler" }
# Not used from Rust: listed so building the CLI also builds the runtime
# library (libtessel_runtime.a) that `tessel build` links programs against.
tessel-runtime = { path = "../tessel-runtime" }

[lints]
workspace = true
