[package]
name = "tessel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tessel"
path = "src/main.rs"

[features]
# The runtime's renderers (see tessel-runtime's features): the GPU one, and
# the system's on macOS and Windows.
default = ["gpu", "native"]
gpu = ["tessel-runtime/gpu"]
native = ["tessel-runtime/native"]
# Build LLVM's linker (lld) into `tessel` (release packages), so building apps
# doesn't need Apple's Command Line Tools or Visual Studio's linker.
bundled-linker = []

[build-dependencies]
cc = "1.5.1"

[dependencies]
cc = "1.5.1"
lsp-server = "0.10"
lsp-types = "0.97"
# `tessel repl`: editing the line being typed, and earlier lines with the arrow keys.
rustyline = { version = "17", default-features = false }
# The installer of Windows apps: the app inside it, compressed (see setup.rs).
flate2 = "1"
# App icons: reading `icon.png` and writing it at each size.
png = "0.18.1"
serde_json = "1.0.151"
# `tessel update`: download a release and check it against its SHA256SUMS.
sha2 = "0.10"
ureq = "3.4.2"
tessel-compiler = { path = "../tessel-compiler" }
# Building the CLI also builds the runtime library (libtessel_runtime.a)
# that `tessel build` links programs against. `tessel` contains the runtime
# too, for the code `tessel repl` runs.
tessel-runtime = { path = "../tessel-runtime", default-features = false }
toml = "0.9"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# The WebSocket echo server of the networking test.
tungstenite = "0.30.0"

[lints]
workspace = true
